<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1B2A4A">
<title>家装施工流程指南 · 装修顺序一次看明白</title>
<style>
:root{
  --navy:#1B2A4A;--navy2:#27406B;--orange:#FF9A3C;--orange-d:#F08428;
  --bg:#F2F5FA;--card:#FFFFFF;--line:#E4E9F2;--text:#26303F;--sub:#6B7689;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;font-size:16px;
  padding-bottom:88px;
}
.wrap{max-width:560px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;}

/* ---------- 顶部 ---------- */
.hero{
  background:linear-gradient(150deg,#22365C 0%,#16233F 55%,#101A2F 100%);
  color:#fff;padding:34px 24px 30px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;top:-70px;right:-60px;width:220px;height:220px;
  background:radial-gradient(circle,rgba(255,154,60,.28),transparent 68%);
}
.hero .badge{
  display:inline-block;background:rgba(255,154,60,.18);color:var(--orange);
  border:1px solid rgba(255,154,60,.45);font-size:12px;font-weight:700;
  padding:4px 12px;border-radius:20px;letter-spacing:.5px;margin-bottom:14px;
}
.hero h1{margin:0 0 10px;font-size:25px;font-weight:800;letter-spacing:.5px;line-height:1.4;}
.hero p{margin:0;color:#B9C6DE;font-size:14.5px;position:relative;}
.hero .stats{display:flex;gap:26px;margin-top:22px;position:relative;}
.hero .stats div{font-size:12px;color:#96A5C2;}
.hero .stats b{display:block;font-size:21px;color:var(--orange);font-weight:800;letter-spacing:.5px;}

/* ---------- 通用 ---------- */
.sec-title{
  display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;color:var(--navy);
  margin:24px 20px 12px;
}
.sec-title .bar{width:4px;height:17px;background:var(--orange);border-radius:2px;}

/* ---------- 阶段列表 ---------- */
.list{padding:0 16px;}
.card{
  background:var(--card);border-radius:15px;padding:15px 16px;margin-bottom:11px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 2px 12px rgba(27,42,74,.06);
  cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;
}
.card:active{transform:scale(.985);box-shadow:0 1px 6px rgba(27,42,74,.09);}
.card.done{background:#F7FAF8;}
.ico{
  width:46px;height:46px;flex:none;border-radius:13px;
  background:linear-gradient(140deg,#2B4370,#1B2A4A);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 3px 9px rgba(27,42,74,.22);
}
.card.done .ico{background:linear-gradient(140deg,#3FA36B,#2E7D50);}
.card .mid{flex:1;min-width:0;}
.card .name{font-size:16.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:7px;}
.card .no{
  font-size:11px;font-weight:800;color:#fff;background:var(--orange);
  min-width:19px;height:19px;border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;padding:0 5px;flex:none;
}
.card .tag{font-size:13px;color:var(--sub);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card .arrow{color:#C3CCDC;font-size:19px;flex:none;font-weight:300;}
.card.done .arrow{color:#3FA36B;}

/* ---------- 详情 ---------- */
.page-head{
  background:linear-gradient(150deg,#22365C,#101A2F);color:#fff;
  padding:20px 20px 26px;position:relative;
}
.back{
  display:inline-flex;align-items:center;gap:5px;font-size:14px;color:#B9C6DE;
  margin-bottom:16px;cursor:pointer;font-weight:600;
}
.ph-top{display:flex;align-items:center;gap:14px;}
.ph-ico{
  width:56px;height:56px;flex:none;border-radius:16px;font-size:27px;
  background:linear-gradient(140deg,rgba(255,154,60,.9),rgba(240,132,40,.85));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 16px rgba(255,154,60,.32);
}
.ph-name{font-size:22px;font-weight:800;line-height:1.3;}
.ph-tag{font-size:13px;color:#B9C6DE;margin-top:3px;}

.block{
  background:var(--card);border-radius:15px;margin:12px 16px;padding:17px 18px;
  box-shadow:0 2px 12px rgba(27,42,74,.06);
}
.block.next{border-left:5px solid var(--orange);background:#FFFBF6;}
.bh{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;
  color:var(--navy);margin-bottom:11px;}
.bh .bico{
  width:28px;height:28px;flex:none;border-radius:9px;font-size:15px;
  background:#EDF1F8;display:flex;align-items:center;justify-content:center;
}
.bh .bico.o{background:#FFEFDD;}
.block-text{font-size:15px;color:#3B4757;}
.item{
  font-size:15px;color:#3B4757;padding:6px 0 6px 20px;position:relative;line-height:1.6;
}
.item::before{
  content:"";position:absolute;left:5px;top:14px;width:6px;height:6px;
  border-radius:50%;background:#B9C6DE;
}
.item.o::before{background:var(--orange);}
.item.sm::before{background:var(--navy2);}
.next-box{
  background:linear-gradient(135deg,#FFF3E6,#FFE9D2);border-radius:11px;
  padding:13px 16px;display:flex;align-items:center;gap:11px;
}
.next-box .nb-ico{font-size:22px;}
.next-box .nb-t{font-size:12px;color:#B06A21;font-weight:700;letter-spacing:.5px;}
.next-box .nb-v{font-size:17px;font-weight:800;color:var(--navy);margin-top:1px;}
.smart-time{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#FFB05E,#F08428);color:#fff;
  font-size:12.5px;font-weight:800;padding:6px 14px;border-radius:20px;
  letter-spacing:.4px;margin-bottom:12px;box-shadow:0 3px 10px rgba(240,132,40,.3);
}
.subh{
  font-size:13px;font-weight:800;color:var(--orange-d);margin:14px 0 4px;
  padding-top:12px;border-top:1px dashed var(--line);
}
.block.smart{border-left:5px solid var(--navy);}
.block.smart .item{color:var(--navy);font-weight:500;}
.block.local-block{
  border-left:5px solid var(--orange);
  background:linear-gradient(135deg,#FFFCF8,#FFF8F0);
}
.block.local-block .bh{color:#B0621F;}
.block.local-block .bh .bico{background:#FFEFDD;}
.item.lc::before{background:var(--orange);}

/* ---------- 进度条 ---------- */
.prog-card{
  background:var(--card);border-radius:15px;margin:16px;padding:18px 20px;
  box-shadow:0 2px 12px rgba(27,42,74,.06);
}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px;flex-wrap:nowrap;}
.prog-top .pt-l{font-size:14.5px;font-weight:800;color:var(--navy);white-space:nowrap;}
.prog-top .pt-r{font-size:13px;color:var(--sub);white-space:nowrap;}
.prog-top .pt-r b{color:var(--orange);font-size:19px;font-weight:800;}
.bar-bg{height:11px;background:#EAEFF7;border-radius:6px;overflow:hidden;}
.bar-fill{
  height:100%;border-radius:6px;width:0;
  background:linear-gradient(90deg,var(--orange),#FFB86B);
  transition:width .45s cubic-bezier(.4,0,.2,1);
}
.now-box{
  margin-top:15px;background:linear-gradient(135deg,#F3F7FE,#E8F0FC);
  border-radius:11px;padding:13px 15px;display:flex;align-items:center;gap:12px;
}
.now-box .ni{font-size:24px;}
.now-box .nlab{font-size:11.5px;color:var(--sub);font-weight:700;letter-spacing:.5px;}
.now-box .nval{font-size:16px;font-weight:800;color:var(--navy);margin-top:2px;}

/* ---------- 打卡行 ---------- */
.prow{
  display:flex;align-items:center;gap:12px;background:var(--card);
  border-radius:13px;padding:12px 15px;margin-bottom:9px;cursor:pointer;
  box-shadow:0 1px 8px rgba(27,42,74,.05);transition:background .2s;
}
.prow:active{background:#F6F9FD;}
.prow .pico{
  width:38px;height:38px;flex:none;border-radius:11px;font-size:18px;
  background:linear-gradient(140deg,#EEF3FB,#E2EAF7);
  display:flex;align-items:center;justify-content:center;
}
.prow .pn{flex:1;font-size:15px;font-weight:600;color:var(--navy);min-width:0;}
.prow.done .pn{color:#8A94A6;}
.prow.done .pico{background:linear-gradient(140deg,#E6F5EC,#D8EEE2);}
.tick{
  width:25px;height:25px;flex:none;border-radius:50%;border:2px solid #CFD8E6;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  color:transparent;transition:all .2s;
}
.prow.done .tick{background:#3FA36B;border-color:#3FA36B;color:#fff;}

/* ---------- 领取区 ---------- */
.cta{
  margin:22px 16px 8px;
  background:linear-gradient(150deg,#22365C,#16233F);border-radius:17px;
  padding:22px 20px;color:#fff;text-align:center;position:relative;overflow:hidden;
}
.cta::after{
  content:"";position:absolute;bottom:-50px;left:-40px;width:170px;height:170px;
  background:radial-gradient(circle,rgba(255,154,60,.22),transparent 70%);
}
.cta h3{margin:0 0 7px;font-size:19px;font-weight:800;position:relative;}
.cta p{margin:0 0 17px;font-size:13.5px;color:#B9C6DE;position:relative;}
.cta .btns{display:flex;gap:10px;position:relative;}
.btn{
  flex:1;border:none;border-radius:11px;padding:13px 10px;font-size:15px;
  font-weight:800;cursor:pointer;font-family:inherit;transition:transform .15s;
}
.btn:active{transform:scale(.97);}
.btn-o{background:linear-gradient(135deg,#FFA94D,#F08428);color:#fff;
  box-shadow:0 4px 14px rgba(240,132,40,.35);}
.btn-gh{background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.28);}

/* ---------- 底部固定栏 ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;
  max-width:560px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar .tb{
  flex:1;text-align:center;padding:9px 0 7px;font-size:11px;color:#93A0B5;
  cursor:pointer;font-weight:600;
}
.tabbar .tb .ti{font-size:21px;display:block;line-height:1.3;filter:grayscale(1);opacity:.55;}
.tabbar .tb.on{color:var(--navy);}
.tabbar .tb.on .ti{filter:none;opacity:1;}

/* ---------- 关于 ---------- */
.about-hero{
  background:linear-gradient(150deg,#22365C,#101A2F);color:#fff;
  padding:34px 24px 28px;text-align:center;position:relative;overflow:hidden;
}
.about-hero::after{
  content:"";position:absolute;top:-60px;left:50%;transform:translateX(-50%);
  width:210px;height:210px;background:radial-gradient(circle,rgba(255,154,60,.25),transparent 68%);
}
.ava{
  width:76px;height:76px;border-radius:50%;margin:0 auto 14px;font-size:33px;
  background:linear-gradient(140deg,#FFA94D,#E8731A);
  display:flex;align-items:center;justify-content:center;font-weight:800;
  box-shadow:0 6px 20px rgba(240,132,40,.35);position:relative;
}
.about-hero h2{margin:0 0 6px;font-size:21px;font-weight:800;position:relative;}
.about-hero .sub{font-size:13.5px;color:#B9C6DE;position:relative;}
.about-hero .stats{display:flex;justify-content:center;gap:30px;margin-top:20px;position:relative;}
.about-hero .stats div{font-size:11.5px;color:#96A5C2;}
.about-hero .stats b{display:block;font-size:19px;color:var(--orange);font-weight:800;}

/* ---------- 提示条 ---------- */
.toast{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
  background:rgba(20,30,50,.94);color:#fff;padding:14px 26px;border-radius:13px;
  font-size:15px;font-weight:700;z-index:999;opacity:0;pointer-events:none;
  transition:all .25s;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

.hide{display:none!important;}
.foot{text-align:center;font-size:11.5px;color:#9AA6BA;padding:20px 0 6px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

const STAGES=[
{id:0,name:"前期准备",tag:"想清楚再动手",icon:"📋",
desc:"装修还没正式动工，先把自家的需求、预算和大致方案想清楚，定好风格，避免后期反复改、反复花钱。",
works:["想清楚家里几口人住、各自生活习惯和收纳需求","定下装修风格和大致预算（建议留出 10%-20% 机动钱）","找设计师或装修公司量房、出平面方案和报价","确定要不要中央空调、新风、全屋智能（这些影响后面水电）","去建材市场转一转，了解瓷砖、地板、卫浴等主材行情"],
next:"物业报备 + 拆改",

attn:["多和设计师、家人当面沟通需求，反复确认比后期返工省大钱","量房时自己最好在场，确认尺寸和承重墙、配重墙位置","先定大件家电（中央空调/新风/全屋智能），再定最终方案","合同和报价单逐条看，看不懂的当场问清楚"],
smartTime:"智能规划期 · 定方案选网关",
local:["长治冬天冷、夏天不算太潮，方案要以采暖为核心，地暖/暖气片先定，再谈格局","老小区多是砖混楼，层高普遍 2.8 米左右，吊顶别做太厚，压层高","本地装修公司爱把\"全包\"报很低，看清套餐里含不含水电改造和主材，多数是不含的","先量房再谈钱，长治房子朝向和采光差异大，同一个小区也未必一样"],
smart:["想装智能，这一步就要定方案：选米家/华为/涂鸦等系统，定中枢网关放哪","列清智能清单：智能开关、灯具、窗帘、门锁、传感器、摄像头、暖通","网络规划提前做：每个房间留网线，弱电箱留电源和散热空间","智能和定制柜一起想，避免后期柜子挡了面板和传感器"],

pit:["别脑子一热就开工，前期想清楚最省钱","预算一定要留机动，装修几乎都会超一点","合同里增项怎么算、怎么收费，一定写清楚"]},
{id:1,name:"物业报备 + 拆改",tag:"报备登记改格局",icon:"🏠",
desc:"先去物业登记报备、交装修押金，拿到允许后再按图纸拆墙、砌墙、改格局。这一步是把房子变成你想要的样子。",
works:["到物业报备，交装修押金，办工人出入证","确认哪些墙能拆、哪些绝对不能动","拆除非承重墙、多余隔断","按新方案新建墙体","拆旧门窗（如需要）"],
next:"水电改造",

attn:["动工前再三确认承重墙、配重墙、剪力墙位置（物业图纸标红）","拆改垃圾及时装袋清运，别堆楼道惹投诉","拆改后复核现场尺寸，和图纸一致再往下走","敲墙时周围没人，注意安全"],
smartTime:"拆改期 · 弱电与网线定位",

smart:["拆改一般不动智能布线，但先确认弱电箱位置和入户光纤走向","如果改格局，留意保留或新增网线点位（书房、客厅电视墙）","智能中枢/路由器打算放哪，提前想好，影响后面布线"],

{id:2,name:"水电改造",tag:"隐蔽工程最关键",icon:"⚡",
desc:"这是最关键的隐蔽工程。按你平时怎么用，重新布置电线和水管，开槽、走线、布管。装完就埋墙里了，以后改不了，所以最费心。",
works:["和水电师傅现场交底，定好每个插座、开关、水龙头位置","墙面地面开槽","布管、穿线（电线水管走好）","预留智能设备、净水器、扫地机器人等线路","厨房、卫生间单独回路"],
next:"防水 + 闭水试验",
accept:["对照点位图，逐个核对插座开关位置对不对","水管打压测试，不漏水","拍照留存所有布线走向（以后墙上打孔要用）"],
attn:["和水电师傅现场逐一点位交底，边走边定最准","全程最好自己盯，尤其开槽深度、管线走向","强弱电交叉处包锡纸防信号干扰","完工立刻拍照留底（带尺寸），以后墙上打孔全靠它"],
smartTime:"水电期 · 核心布线留零线",
local:["长治集中供暖，暖气管道改造要单独找热力公司或专业水暖工，别让水电工顺手改","老房多是单火线，想上智能开关必须借水电改造这次补零线，否则以后没机会","本地水质偏硬，净水器和软水机建议提前留位和电源，事后加装很麻烦","冬季施工注意：气温低于 5 度别做水管打压外露测试，容易冻裂"],

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1500);
}
function copyText(txt){
  const ta=document.createElement("textarea");
  ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("已复制：" + txt);}
  catch(e){toast("请手动复制：" + txt);}
  document.body.removeChild(ta);
}

  bind();
  window.scrollTo(0,0);
}

  return `<div class="tabbar">
    ${t("home","📋","流程")}
    ${t("progress","✅","进度")}
    ${t("about","🧰","关于")}
  </div>`;
}

/* ============ 事件绑定 ============ */
function bind(){
  document.querySelectorAll("[data-go]").forEach(el=>{
    el.onclick=()=>{curId=+el.dataset.go;view="detail";render();};
  });
  document.querySelectorAll("[data-back]").forEach(el=>{
    el.onclick=()=>{view="home";render();};
  });
  document.querySelectorAll("[data-tab]").forEach(el=>{
    el.onclick=()=>{view=el.dataset.tab;render();};
  });
  document.querySelectorAll("[data-checkin]").forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      const id=+el.dataset.checkin;
      const i=done.indexOf(id);
      if(i>=0){done.splice(i,1);toast("已取消打卡");}
      else{
        done.push(id);saveDone();
        const nxt=STAGES.find(s=>s.id===id).next;
        if(nxt){toast("👍 完成！下一步：" + nxt);}
        else{toast("🎉 全部完成，恭喜入住！");}
      }
      saveDone();
      setTimeout(()=>{
        if(view==="detail"){
          const nxt=STAGES.find(s=>s.id===curId).nextId;
          if(done.includes(curId) && nxt>=0){curId=nxt;}
        }
        render();
      },700);
    };
  });
  document.querySelectorAll("[data-reset]").forEach(el=>{
    el.onclick=()=>{
      if(confirm("确定清空所有进度吗？")){done=[];saveDone();render();toast("已清空");}
    };
  });
  document.querySelectorAll("[data-copy]").forEach(el=>{
    el.onclick=()=>copyText(el.dataset.copy);
  });
  document.querySelectorAll("[data-call]").forEach(el=>{
    el.onclick=()=>{
      if(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)){
        window.location.href="tel:"+CONFIG.phone;
      }else{
        copyText(CONFIG.phone);
      }
    };
  });
}

render();
</script>
</body>
</html>
